<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Page not found — Fluxo</title>
  <link rel="icon" type="image/png" href="/favicon-32x32.png">
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #111827; }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    img { width: 3rem; height: 3rem; }
    p { color: #6b7280; line-height: 1.6; }
    a { display: inline-block; margin-top: 1rem; border-radius: .5rem; background: #2563eb; padding: .75rem 1rem; color: #fff; font-weight: 700; text-decoration: none; }
    @media (prefers-color-scheme: dark) { body { background: #030712; color: #f9fafb; } p { color: #9ca3af; } }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="">
    <h1>Page not found</h1>
    <p>The page may have moved, or the address may be incorrect.</p>
    <a href="/">Return to Fluxo</a>
  </main>
</body>
</html>
