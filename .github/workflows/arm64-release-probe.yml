name: ARM64 published release probe

on:
  push:
    branches: [test/arm64-bridge-acceptance]
    paths:
      - .github/workflows/arm64-release-probe.yml
      - scripts/ci/arm64_release_probe.py

permissions:
  contents: read

concurrency:
  group: arm64-release-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unchanged-release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Test unchanged public v0.4.47 on native ARM64
        run: |
          sudo env \
            FLUXO_ARM64_RELEASE_PROBE=1 \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_REF="$GITHUB_REF" \
            RUNNER_ARCH="$RUNNER_ARCH" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            FLUXO_PROBE_OUTPUT="$RUNNER_TEMP/arm64-release-report" \
            python3 scripts/ci/arm64_release_probe.py

      - name: Retain sanitized findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arm64-public-v0.4.47-${{ github.run_id }}
          path: ${{ runner.temp }}/arm64-release-report/
          if-no-files-found: error
          retention-days: 7
