name: Native traffic candidate acceptance

on:
  workflow_dispatch:
    inputs:
      ubuntu:
        description: Native Ubuntu fixture selection
        type: choice
        options: ['all', '22.04', '24.04', '26.04', 'amd64-24.04']
        default: 'all'
      existing_overview:
        description: AMD64 24.04 only; upgrade exact published base-test with existing overview history
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: traffic-candidate-${{ github.ref }}-${{ inputs.ubuntu }}
  cancel-in-progress: false

jobs:
  native:
    if: github.ref == 'refs/heads/test/base-vps-trial'
    name: ${{ matrix.fixture == 'amd64-24.04' && 'AMD64 Ubuntu 24.04' || format('ARM64 Ubuntu {0}', matrix.fixture) }} origin traffic
    strategy:
      fail-fast: false
      matrix:
        fixture: ${{ inputs.ubuntu == 'all' && fromJSON('["22.04","24.04","26.04"]') || fromJSON(format('["{0}"]', inputs.ubuntu)) }}
    runs-on: ${{ matrix.fixture == 'amd64-24.04' && 'ubuntu-24.04' || format('ubuntu-{0}-arm', matrix.fixture) }}
    timeout-minutes: 35
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: ${{ matrix.fixture == 'amd64-24.04' && 'amd64' || 'arm64' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build embedded UI then exact native candidate with all 19 official pins
        timeout-minutes: 10
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/ci -p '*candidate_test.py'
          (cd ui && npm ci && npm run build)
          mkdir -p "$RUNNER_TEMP/traffic-build"
          python3 scripts/ci/build_release_candidate.py "$RUNNER_TEMP/traffic-build/fluxo" 0.0.0-base.dev
          cp install.sh "$RUNNER_TEMP/traffic-build/install.sh"
      - name: Stage exact immutable previous release for optional overview migration
        if: inputs.existing_overview
        run: |
          set -euo pipefail
          test '${{ matrix.fixture }}' = amd64-24.04
          mkdir -p "$RUNNER_TEMP/traffic-previous"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/FabioTECH1/fluxo/releases/download/v0.4.52-base-test.1/fluxo-linux-amd64 \
            --output "$RUNNER_TEMP/traffic-previous/fluxo"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/FabioTECH1/fluxo/releases/download/v0.4.52-base-test.1/install.sh \
            --output "$RUNNER_TEMP/traffic-previous/install.sh"
          PYTHONPATH=scripts/ci python3 -c 'import pathlib,sys; import traffic_arm_acceptance as t; t.verify_previous_build(pathlib.Path(sys.argv[1]), "amd64")' "$RUNNER_TEMP/traffic-previous"
      - name: Fresh base, opt-in traffic, genuine jobs and ordinary update preservation
        timeout-minutes: 24
        run: |
          set -euo pipefail
          previous_args=()
          if [[ '${{ inputs.existing_overview }}' == true ]]; then
            previous_args+=(--previous-build-dir "$RUNNER_TEMP/traffic-previous")
          fi
          sudo env FLUXO_TRAFFIC_ARM_CANDIDATE=${{ matrix.fixture == 'amd64-24.04' && '0' || '1' }} \
            FLUXO_TRAFFIC_AMD_CANDIDATE=${{ matrix.fixture == 'amd64-24.04' && '1' || '0' }} GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" \
            RUNNER_ARCH="$RUNNER_ARCH" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/ci/traffic_arm_acceptance.py \
              --build-dir "$RUNNER_TEMP/traffic-build" --output "$RUNNER_TEMP/traffic-report" "${previous_args[@]}"
      - name: Retain exact native candidate and sanitized results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: traffic-${{ github.sha }}-${{ matrix.fixture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/traffic-build/fluxo
            ${{ runner.temp }}/traffic-build/fluxo.manifest.json
            ${{ runner.temp }}/traffic-build/install.sh
            ${{ runner.temp }}/traffic-report/report.json
            ${{ runner.temp }}/traffic-report/*-sanitized.log
          if-no-files-found: error
          retention-days: 7
