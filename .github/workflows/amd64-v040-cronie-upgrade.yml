name: AMD64 v040 Cronie upgrade investigation
on:
  push:
    branches: [test/amd64-v040-cronie-upgrade-20261118]
    paths:
      - .github/workflows/amd64-v040-cronie-upgrade.yml
      - scripts/ci/amd64_v040_cronie_upgrade.py
      - scripts/ci/amd64_v040_wait.py
      - internal/bridge/**
      - internal/services/maintenancetask/**
      - internal/services/scheduler/**
permissions:
  contents: read
concurrency:
  group: amd64-v040-cronie-upgrade-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        scenario: [node-full]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Retain fixture harness and pin already-accepted candidate source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/amd64-native-harness"
          cp scripts/ci/amd64_v040_cronie_upgrade.py scripts/ci/amd64_v040_wait.py "$RUNNER_TEMP/amd64-native-harness/"
          echo "NATIVE_HARNESS=$RUNNER_TEMP/amd64-native-harness" >> "$GITHUB_ENV"
          echo "NATIVE_CANDIDATE_SOURCE=4a613f6ab7415928d38ae6b222994b22e2efa8fa" >> "$GITHUB_ENV"
          git fetch --no-tags --depth=1 origin 4a613f6ab7415928d38ae6b222994b22e2efa8fa
          git checkout --detach 4a613f6ab7415928d38ae6b222994b22e2efa8fa
      - name: Build exact source candidate
        run: |
          set -euo pipefail
          (cd ui && npm ci && npm run build)
          go test ./internal/bridge ./internal/services/maintenancetask ./internal/services/scheduler
          source .github/release-tool-versions.conf
          mkdir -p "$RUNNER_TEMP/amd64-v040-build"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/amd64-v040-build/fluxo" -ldflags "-X main.version=0.4.48-amd64-cronie-test -X fluxo/internal/releaseinfo.ComposerVersion=$COMPOSER_VERSION -X fluxo/internal/releaseinfo.ComposerSHA256=$COMPOSER_SHA256 -X fluxo/internal/releaseinfo.WPCLIVersion=$WP_CLI_VERSION" ./cmd/fluxo
          test "$(sha256sum "$RUNNER_TEMP/amd64-v040-build/fluxo" | cut -d " " -f1)" = bb12f988de0f99e51dbb441da064469f4b798b5f626953d51c829f4b477ae753
      - name: Start isolated native controller
        run: |
          set -euo pipefail
          unit="fluxo-amd64-native-${{ matrix.scenario }}-${{ github.run_id }}"
          echo "NATIVE_UNIT=$unit" >> "$GITHUB_ENV"
          echo "NATIVE_OUTPUT=$RUNNER_TEMP/amd64-v040-report" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/amd64-v040-report"
          sudo systemd-run --unit="$unit" --property=RuntimeMaxSec=2100s \
            --property="WorkingDirectory=$GITHUB_WORKSPACE" \
            /usr/bin/env FLUXO_AMD64_V040_NATIVE=1 GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_REF="$GITHUB_REF" RUNNER_ARCH="$RUNNER_ARCH" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_SHA="$NATIVE_CANDIDATE_SOURCE" FLUXO_NATIVE_HARNESS_SOURCE="$GITHUB_SHA" \
            FLUXO_NATIVE_SCENARIO="${{ matrix.scenario }}" \
            FLUXO_NATIVE_BUILD="$RUNNER_TEMP/amd64-v040-build" \
            FLUXO_NATIVE_OUTPUT="$RUNNER_TEMP/amd64-v040-report" \
            /usr/bin/python3 "$NATIVE_HARNESS/amd64_v040_cronie_upgrade.py"
      - name: Establish supported Noble fixture (bounded)
        run: python3 "$NATIVE_HARNESS/amd64_v040_wait.py" "$NATIVE_OUTPUT" fixture-prepared 600 "$NATIVE_UNIT"
      - name: Install published v0.4.40 (bounded)
        run: python3 "$NATIVE_HARNESS/amd64_v040_wait.py" "$NATIVE_OUTPUT" old-installed 620 "$NATIVE_UNIT"
      - name: Obtain genuine old receipts and preserve originals (bounded)
        run: python3 "$NATIVE_HARNESS/amd64_v040_wait.py" "$NATIVE_OUTPUT" old-receipts-preserved 400 "$NATIVE_UNIT"
      - name: Refuse unresolved historical work (bounded)
        if: matrix.scenario == 'uncertain'
        run: python3 "$NATIVE_HARNESS/amd64_v040_wait.py" "$NATIVE_OUTPUT" finished 150 "$NATIVE_UNIT"
      - name: Refuse surviving child and reproduce public v47 failure (bounded)
        if: matrix.scenario != 'uncertain'
        run: python3 "$NATIVE_HARNESS/amd64_v040_wait.py" "$NATIVE_OUTPUT" public47-reproduced 300 "$NATIVE_UNIT"
      - name: Prove candidate safe lease admission before full installer (bounded)
        if: matrix.scenario == 'probe'
        run: python3 "$NATIVE_HARNESS/amd64_v040_wait.py" "$NATIVE_OUTPUT" finished 120 "$NATIVE_UNIT"
      - name: Reach and interrupt durable normal-installer operation (bounded)
        if: matrix.scenario == 'full' || matrix.scenario == 'node-full'
        run: python3 "$NATIVE_HARNESS/amd64_v040_wait.py" "$NATIVE_OUTPUT" candidate-interrupted 400 "$NATIVE_UNIT"
      - name: Recover exact normal-installer operation (bounded)
        if: matrix.scenario == 'full' || matrix.scenario == 'node-full'
        run: python3 "$NATIVE_HARNESS/amd64_v040_wait.py" "$NATIVE_OUTPUT" installer-recovered 400 "$NATIVE_UNIT"
      - name: Require real fresh acknowledgements and continued jobs (bounded)
        if: matrix.scenario == 'full' || matrix.scenario == 'node-full'
        run: python3 "$NATIVE_HARNESS/amd64_v040_wait.py" "$NATIVE_OUTPUT" finished 420 "$NATIVE_UNIT"
      - name: Stop only own native controller
        if: always()
        run: |
          if sudo systemctl is-active --quiet "$NATIVE_UNIT"; then
            sudo timeout 40s systemctl stop "$NATIVE_UNIT"
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amd64-v040-cronie-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/amd64-v040-report/
          if-no-files-found: error
          retention-days: 7
