name: ARM64 Node cache fixture metadata
on:
  push:
    branches: [test/arm64-bridge-acceptance]
    paths: [.github/workflows/arm64-node-cache-metadata.yml, scripts/ci/arm64_node_cache_metadata.py]
permissions:
  contents: read
jobs:
  metadata:
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    runs-on: ubuntu-${{ matrix.ubuntu }}-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inspect isolated cache creation under the installer sudo boundary
        run: sudo env GITHUB_REF="$GITHUB_REF" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 scripts/ci/arm64_node_cache_metadata.py
