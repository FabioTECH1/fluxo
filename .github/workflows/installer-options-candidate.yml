name: Installer selected-options acceptance
on:
  push:
    branches: [test/installer-component-options]
permissions:
  contents: read
concurrency:
  group: installer-options-${{ github.ref }}
  cancel-in-progress: false
jobs:
  selected-options:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    name: Stable bridge from ${{ matrix.predecessor }} (${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - predecessor: stable53
            engine: cron
          - predecessor: trial7
            engine: cronie
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Prepare fixture and build only unsigned source candidates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/options-build" "$RUNNER_TEMP/options-fixture"
          if [ ! -f scripts/ci/installer_options_expected_public.json ]; then
            (cd ui && npm ci && npm run build)
            python3 scripts/ci/build_release_candidate.py "$RUNNER_TEMP/options-build/fluxo" 0.4.54
          fi
          cp install.sh "$RUNNER_TEMP/options-build/install.sh"
          # Reuse already reviewed disposable hosted preparation from an exact
          # test-only source. No BASE production code is built or installed.
          for name in base_candidate arm64_candidate arm64_release_probe build_release_candidate; do
            git show 8dd7de465bfc0e2c1c96a3a33097e6e6e1276644:scripts/ci/$name.py > "$RUNNER_TEMP/options-fixture/$name.py"
          done
      - name: Independently verify all immutable public assets before native use
        if: hashFiles('scripts/ci/installer_options_expected_public.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FLUXO_RELEASE_SOURCE: b1677c94960680022e7185544bb4aaab03712fef
          FLUXO_VERIFY_OUTPUT: ${{ runner.temp }}/options-public
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_installer_options_release.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          expected=json.loads(Path('scripts/ci/installer_options_expected_public.json').read_text())
          actual=json.loads((Path(os.environ['FLUXO_VERIFY_OUTPUT'])/'verified-public-release.json').read_text())
          assert actual['tag']==expected['tag'] and actual['source']==expected['source'] and actual['public_artifact_integrity_passed'] is True
          subject={**expected,'public_artifact_integrity_passed':True,
                   'amd64_sha256':actual['assets']['fluxo-linux-amd64']['sha256'],
                   'installer_sha256':actual['assets']['install.sh']['sha256'],
                   'predecessor':'${{ matrix.predecessor }}','engine':'${{ matrix.engine }}'}
          Path('scripts/ci/installer_options_subject.json').write_text(json.dumps(subject,indent=2)+'\n')
          PY
      - name: Relay verified public stable assets for independent checks
        if: matrix.predecessor == 'stable53'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bridge-stable-public-${{ github.sha }}-v0.4.54
          path: |
            ${{ runner.temp }}/options-public/assets/*
            ${{ runner.temp }}/options-public/verified-public-release.json
          if-no-files-found: error
          retention-days: 7
      - name: Real selected-options install, ordinary reinstall and busy Node CLI
        run: |
          sudo env FLUXO_OPTIONS_HOSTED_TEST=1 GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_ARCH="$RUNNER_ARCH" \
            python3 scripts/ci/installer_options_candidate.py \
              "$RUNNER_TEMP/options-build" "$RUNNER_TEMP/options-fixture" "$RUNNER_TEMP/options-report"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-options-${{ github.sha }}-${{ github.run_id }}-${{ matrix.predecessor }}
          path: |
            ${{ runner.temp }}/options-report/
            ${{ runner.temp }}/options-build/
            ${{ runner.temp }}/options-public/assets/*
            ${{ runner.temp }}/options-public/*.json
            ${{ runner.temp }}/options-public/*.txt
          if-no-files-found: error
          retention-days: 7
