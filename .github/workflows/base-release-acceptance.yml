name: Native public base release acceptance

on:
  workflow_dispatch:
    inputs:
      cases:
        description: Public cases to run
        type: choice
        options: [all, bridge, base]
        default: base
      presentation_only:
        description: Verify public bytes and terminal output only; do not repeat installation
        type: boolean
        default: false
  push:
    branches: [test/base-public-release-acceptance]

permissions:
  contents: read

concurrency:
  group: base-public-release-${{ github.ref }}-${{ inputs.cases || 'all' }}
  cancel-in-progress: false

# Commit the exact reviewed post-publication subject file to this isolated
# branch before pushing it. It is intentionally absent until all releases exist.
# No URL, artifact name, digest override, runner or optional package input.
jobs:
  native:
    if: github.repository == 'FabioTECH1/fluxo' && github.ref == 'refs/heads/test/base-public-release-acceptance'
    name: Ubuntu 24.04 ${{ matrix.case }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cases == 'bridge' && '[{"runner":"ubuntu-24.04","case":"amd64-bridge"}]' || inputs.cases == 'all' && '[{"runner":"ubuntu-24.04","case":"amd64-bridge"},{"runner":"ubuntu-24.04","case":"amd64-base"}]' || '[{"runner":"ubuntu-24.04","case":"amd64-base"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Check focused public acceptance oracles
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/ci -p 'base_release_acceptance_test.py'
          python3 internal/services/phpupdate/installer_scheduler_test.py "$PWD/install.sh"
          test -f scripts/ci/evidence/base-release-acceptance-subject.json
      - name: Bounded signed public installer and actual Node preservation acceptance
        env:
          FLUXO_METADATA_TOKEN: ${{ github.token }}
          PRESENTATION_ONLY: ${{ inputs.presentation_only && 'true' || 'false' }}
        run: |
          set -euo pipefail
          extra_args=()
          if [ "${PRESENTATION_ONLY:-false}" = true ]; then extra_args+=(--presentation-only); fi
          sudo --preserve-env=FLUXO_METADATA_TOKEN env FLUXO_BASE_RELEASE_ACCEPTANCE=1 GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_WORKFLOW="$GITHUB_WORKFLOW" RUNNER_ARCH="$RUNNER_ARCH" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" ImageOS="$ImageOS" ImageVersion="$ImageVersion" \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/ci/base_release_acceptance.py \
              --subject scripts/ci/evidence/base-release-acceptance-subject.json \
              --output "$RUNNER_TEMP/base-public-report" --case '${{ matrix.case }}' \
              --go "$(command -v go)" "${extra_args[@]}"
      - name: Exact-public CLI and installer terminal presentation
        if: success()
        env:
          FLUXO_TERMINAL_BINARY: ${{ runner.temp }}/base-public-report/public-assets/fluxo-linux-amd64
        run: |
          set -euo pipefail
          sudo install -m 0700 -o root -g root -- "$FLUXO_TERMINAL_BINARY" "$RUNNER_TEMP/fluxo-terminal-smoke"
          trap 'sudo rm -f -- "$RUNNER_TEMP/fluxo-terminal-smoke"' EXIT
          # Node CLI preflight reads protected installed state before validating
          # human arguments. Exercise the command in its documented root scope.
          sudo env FLUXO_TERMINAL_BINARY="$RUNNER_TEMP/fluxo-terminal-smoke" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/ci -p terminal_presentation_test.py
      - name: Retain only allowlisted public results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: base-public-${{ github.sha }}-${{ matrix.case }}
          path: ${{ runner.temp }}/base-public-report/report.json
          if-no-files-found: error
          retention-days: 7
      - name: Relay only independently verified public base release assets
        if: always() && matrix.case == 'amd64-base'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: base-public-assets-${{ github.sha }}-v0.4.55-base-test.3
          path: |
            ${{ runner.temp }}/base-public-report/public-assets/fluxo-linux-amd64
            ${{ runner.temp }}/base-public-report/public-assets/fluxo-linux-arm64
            ${{ runner.temp }}/base-public-report/public-assets/install.sh
            ${{ runner.temp }}/base-public-report/public-assets/BRIDGE-CONTRACT.json
            ${{ runner.temp }}/base-public-report/public-assets/TOOLCHAIN-VERSIONS
            ${{ runner.temp }}/base-public-report/public-assets/SHA256SUMS
            ${{ runner.temp }}/base-public-report/public-assets/fluxo-release-attestation.json
            ${{ runner.temp }}/base-public-report/public-assets/LICENSE
            ${{ runner.temp }}/base-public-report/public-assets/verified-public-release.json
          if-no-files-found: warn
          retention-days: 7
