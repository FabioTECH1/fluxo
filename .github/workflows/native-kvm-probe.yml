name: Native guest acceleration probe
on:
  push:
    branches: [test/arm64-bridge-acceptance]
    paths: [.github/workflows/native-kvm-probe.yml]
permissions:
  contents: read
jobs:
  kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect native guest acceleration without changing the host
        run: |
          sudo python3 - <<'PY'
          import fcntl,json,os,pathlib,shutil,platform
          result={'architecture':platform.machine(),'kvm_exists':pathlib.Path('/dev/kvm').exists(),'qemu':shutil.which('qemu-system-x86_64'),'disk_free_bytes':shutil.disk_usage('/tmp').free}
          if result['kvm_exists']:
            with open('/dev/kvm','r+b',buffering=0) as device:result['kvm_api_version']=fcntl.ioctl(device,0xAE00,0)
          print(json.dumps(result))
          PY
