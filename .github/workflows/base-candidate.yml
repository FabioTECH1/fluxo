name: Native base source acceptance

on:
  workflow_dispatch:
    inputs:
      case:
        description: Native fixture selection
        type: choice
        options: [all, amd64-bridge]
        default: all
  push:
    branches: [test/base-native-acceptance]

permissions:
  contents: read

concurrency:
  group: base-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: ${{ matrix.arch }} Ubuntu ${{ matrix.ubuntu }} ${{ matrix.mode }} ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64, ubuntu: '24.04', mode: fresh, engine: cron}
          - {runner: ubuntu-24.04, arch: amd64, ubuntu: '24.04', mode: bridge, engine: cron}
          - {runner: ubuntu-22.04-arm, arch: arm64, ubuntu: '22.04', mode: fresh, engine: cron}
          - {runner: ubuntu-22.04-arm, arch: arm64, ubuntu: '22.04', mode: bridge, engine: cron}
          - {runner: ubuntu-24.04-arm, arch: arm64, ubuntu: '24.04', mode: fresh, engine: cron}
          - {runner: ubuntu-24.04-arm, arch: arm64, ubuntu: '24.04', mode: bridge, engine: cron}
          - {runner: ubuntu-26.04-arm, arch: arm64, ubuntu: '26.04', mode: fresh, engine: cron}
          - {runner: ubuntu-26.04-arm, arch: arm64, ubuntu: '26.04', mode: bridge, engine: cron}
          - {runner: ubuntu-24.04-arm, arch: arm64, ubuntu: '24.04', mode: bridge, engine: cronie}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
    steps:
      - if: github.event_name != 'workflow_dispatch' || inputs.case == 'all' || (matrix.arch == 'amd64' && matrix.mode == 'bridge')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: github.event_name != 'workflow_dispatch' || inputs.case == 'all' || (matrix.arch == 'amd64' && matrix.mode == 'bridge')
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - if: github.event_name != 'workflow_dispatch' || inputs.case == 'all' || (matrix.arch == 'amd64' && matrix.mode == 'bridge')
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - if: github.event_name != 'workflow_dispatch' || inputs.case == 'all' || (matrix.arch == 'amd64' && matrix.mode == 'bridge')
        name: Build exact native development candidate with official pins
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/ci -p '*candidate_test.py'
          (cd ui && npm ci && npm run build)
          mkdir -p "$RUNNER_TEMP/base-build"
          python3 scripts/ci/build_release_candidate.py "$RUNNER_TEMP/base-build/fluxo" 0.0.0-base.dev
          go test -c -o "$RUNNER_TEMP/base-build/scheduler.test" ./internal/services/scheduler
          go test -c -o "$RUNNER_TEMP/base-build/maintenance.test" ./internal/services/maintenancetask
          go test -c -o "$RUNNER_TEMP/base-build/executiondomain.test" ./internal/services/executiondomain
          cp install.sh "$RUNNER_TEMP/base-build/install.sh"
      - if: github.event_name != 'workflow_dispatch' || inputs.case == 'all' || (matrix.arch == 'amd64' && matrix.mode == 'bridge')
        name: Fresh or authentic public bridge, then ordinary base update
        run: |
          sudo env FLUXO_BASE_CANDIDATE=1 GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" \
            RUNNER_ARCH="$RUNNER_ARCH" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            python3 scripts/ci/base_candidate.py \
              --build-dir "$RUNNER_TEMP/base-build" \
              --output "$RUNNER_TEMP/base-report" \
              --mode '${{ matrix.mode }}' --engine '${{ matrix.engine }}'
      - name: Retain exact local candidate artifacts (no public base release)
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.case == 'all' || (matrix.arch == 'amd64' && matrix.mode == 'bridge'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: base-source-${{ github.sha }}-${{ matrix.arch }}-${{ matrix.ubuntu }}-${{ matrix.mode }}-${{ matrix.engine }}
          path: |
            ${{ runner.temp }}/base-build/fluxo
            ${{ runner.temp }}/base-build/fluxo.manifest.json
            ${{ runner.temp }}/base-build/install.sh
            ${{ runner.temp }}/base-report/report.json
            ${{ runner.temp }}/base-report/*-sanitized.log
          if-no-files-found: error
          retention-days: 7
